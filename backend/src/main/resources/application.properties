spring.application.name=mumbai-ops
server.port=${SERVER_PORT:8081}
# Only this computer can reach the backend unless you change it (e.g. SERVER_ADDRESS=0.0.0.0 together with ADMIN_TOKEN).
server.address=${SERVER_ADDRESS:127.0.0.1}
admin.token=${ADMIN_TOKEN:}

# PostgreSQL + PostGIS (docker compose up -d). Every value can be overridden by an environment variable.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:mumbai_ops}?reWriteBatchedInserts=true
spring.datasource.username=${DB_USER:ops}
spring.datasource.password=${DB_PASSWORD:ops_dev_password}
spring.flyway.locations=classpath:db/migration

osrm.url=${OSRM_URL:https://router.project-osrm.org/table/v1/driving/}

sim.tick-ms=${SIM_TICK_MS:1000}
sim.seed=${SIM_SEED:42}
sim.history-days=${SIM_HISTORY_DAYS:21}
sim.autostart=${SIM_AUTOSTART:true}

# Local road network (OpenStreetMap via Overpass), downloaded once and cached here
roads.file=${ROADS_FILE:data/mumbai-roads.bin}
roads.overpass-url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}
